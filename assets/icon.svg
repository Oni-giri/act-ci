<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Omakase corner blooms, light theme: sky, pink, sun, mint -->
    <radialGradient id="bloomSky" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(74 78) scale(254)">
      <stop offset="0" stop-color="#7DD3FC" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomPink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(444 52) scale(214)">
      <stop offset="0" stop-color="#F9A8D4" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomSun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(452 466) scale(226)">
      <stop offset="0" stop-color="#FDE047" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomMint" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(52 452) scale(234)">
      <stop offset="0" stop-color="#6EE7B7" stop-opacity=".38"/>
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Light canvas, rounded like a phone card -->
  <rect width="512" height="512" rx="112" fill="#F7F8FC"/>
  <rect width="512" height="512" rx="112" fill="url(#bloomSky)"/>
  <rect width="512" height="512" rx="112" fill="url(#bloomPink)"/>
  <rect width="512" height="512" rx="112" fill="url(#bloomSun)"/>
  <rect width="512" height="512" rx="112" fill="url(#bloomMint)"/>

  <!-- White card, the only surface Omakase puts content on -->
  <rect x="96" y="96" width="320" height="320" rx="40" fill="#FFFFFF"/>

  <!-- Terminal prompt: the act runner. One accent, drawn not filled. -->
  <path d="M162 194 L244 273 L162 352" stroke="#3B5BFD" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Passed step: RatioBar track with the success run filled -->
  <rect x="284" y="257" width="96" height="18" rx="9" fill="#EEF0F6"/>
  <rect x="284" y="257" width="96" height="18" rx="9" fill="#10B981"/>

  <!-- StatusGlyph: filled circle with the check -->
  <circle cx="172" cy="156" r="21" fill="#10B981"/>
  <path d="M163 157 L170 164 L182 150" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
