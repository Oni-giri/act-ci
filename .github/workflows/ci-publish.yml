name: CI and Publish Multi-Arch Image

on:
  push:
    branches:
      - main
      - "**"
    paths-ignore:
      - ".github/workflows/**"
      - "*.md"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  level1-tests:
    name: "Level 1: Automated Unit & Security Matrix Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Act-CI and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Level 1 suite
        run: pytest -m "not docker" -v

  level2-and-level3-tests:
    name: "Level 2 & 3: Real DinD Runner + Compose Stack Smoke Tests"
    runs-on: ubuntu-latest
    needs: level1-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned nektos/act v0.2.98
        run: |
          set -eux
          curl -fsSL https://github.com/nektos/act/releases/download/v0.2.98/act_Linux_x86_64.tar.gz -o /tmp/act.tar.gz
          echo "d3344bd0810c04b000d2444030b08c90ab9fbf905bbe2c3e26298be00c620d65  /tmp/act.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/act.tar.gz -C /usr/local/bin act
          act --version
      - name: Start isolated Docker-in-Docker daemon for Level 2 slot tests
        run: |
          docker run -d --privileged --name actci-test-dind \
            -e DOCKER_TLS_CERTDIR="" \
            -p 127.0.0.1:23750:2375 \
            docker:27.2.0-dind@sha256:d1d6d5265119696d8fa9b883f813953c560c5d87ea128a57681239b576f62997 \
            dockerd --host=tcp://0.0.0.0:2375 --storage-driver=overlay2
          for i in $(seq 1 30); do
            if docker -H tcp://127.0.0.1:23750 info >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker -H tcp://127.0.0.1:23750 info
          # Pre-pull lightweight runner & service images inside the DinD daemon
          docker -H tcp://127.0.0.1:23750 pull node:20-bookworm-slim
          docker -H tcp://127.0.0.1:23750 pull postgres:16-alpine
      - name: Install Python dependencies and run Level 2 runner suite
        env:
          ACT_CI_TEST_DOCKER_HOST: tcp://127.0.0.1:23750
          ACT_CI_ACT_BINARY: /usr/local/bin/act
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest -m "docker" -v
      - name: Stop Level 2 DinD container
        if: always()
        run: docker rm -f -v actci-test-dind || true
      - name: Run Level 3 Docker Compose stack smoke test
        run: python3 scripts/level3_smoke_test.py

  publish-multiarch:
    name: "Publish Multi-Arch Image (linux/amd64, linux/arm64)"
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    needs: [level1-tests, level2-and-level3-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oni-giri/act-ci
          tags: |
            type=raw,value=0.1.0
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Verify multi-arch manifest list with imagetools inspect
        run: |
          echo "Published digest: ${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "ghcr.io/oni-giri/act-ci:0.1.0@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "docker:27.2.0-dind@sha256:d1d6d5265119696d8fa9b883f813953c560c5d87ea128a57681239b576f62997"

  level4-umbrel-package-checks:
    name: "Level 4: Umbrel Package Static & Containerized umbrelOS Verification"
    runs-on: ubuntu-latest
    if: always() && needs.level1-tests.result == 'success' && needs.level2-and-level3-tests.result == 'success' && (needs.publish-multiarch.result == 'success' || needs.publish-multiarch.result == 'skipped')
    needs: [level1-tests, level2-and-level3-tests, publish-multiarch]
    steps:
      - name: Check out Umbrel store package branch
        uses: actions/checkout@v4
        with:
          repository: Oni-giri/yakitoris-app-store
          ref: feat/yakitori-act-ci
          fetch-depth: 0
          path: store
      - name: Check out getumbrel/umbrel-apps linter
        uses: actions/checkout@v4
        with:
          repository: getumbrel/umbrel-apps
          path: umbrel-lint
      - name: Run official Umbrel linter, git diff --check, and docker compose config
        run: |
          set -eux
          git -C store diff origin/master...HEAD --check
          # Confirm only yakitori-act-ci/ was touched on the store branch
          changed="$(git -C store diff --name-only origin/master...HEAD | cut -d/ -f1 | sort -u)"
          test "$changed" = "yakitori-act-ci"

          cp -a store/yakitori-act-ci umbrel-lint/yakitori-act-ci
          (cd umbrel-lint && npm install --no-audit --no-fund && npm run lint:apps -- yakitori-act-ci --check-images)

          # Render docker compose config with dummy Umbrel variables (filtering Umbrel's virtual app_proxy block)
          python3 -c '
          import pathlib, yaml
          raw = pathlib.Path("store/yakitori-act-ci/docker-compose.yml").read_text()
          doc = yaml.safe_load(raw)
          assert "app_proxy" in doc["services"]
          # Validate standard Docker Compose services (docker + web) with docker compose config
          doc["services"].pop("app_proxy")
          pathlib.Path("/tmp/umbrel-compose-check.yml").write_text(yaml.safe_dump(doc))
          '
          APP_DATA_DIR=/tmp/dummy-app-data \
          APP_YAKITORI_ACT_CI_MASTER_KEY=dummy_master_key_0123456789abcdef0123456789abcdef \
          APP_YAKITORI_ACT_CI_CSRF_SECRET=SI_SECRET_SECRET_U5W01FSH \
          docker compose -f /tmp/umbrel-compose-check.yml config

          docker buildx imagetools inspect "ghcr.io/oni-giri/act-ci:0.1.0@sha256:1ea8f527fdcf38d003adf4f22b15e00a312a23bca97cafb2eb2d5cb7125df5f9"
          docker buildx imagetools inspect "docker:27.2.0-dind@sha256:d1d6d5265119696d8fa9b883f813953c560c5d87ea128a57681239b576f62997"
      - name: Run containerized umbrelOS 2.0.2 fresh-install & update lifecycle checks
        run: |
          set -ux
          # Test containerized umbrelOS 2.0.2 (per umbrel-test-app skill)
          docker pull ghcr.io/getumbrel/umbrelos:2.0.2
          docker run -d --name umbrelos-test \
            --privileged \
            --network host \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -v umbrelos-test:/data \
            ghcr.io/getumbrel/umbrelos:2.0.2 /sbin/init
          READY=0
          for i in $(seq 1 60); do
            if docker exec umbrelos-test umbreld client appStore.registry.query >/dev/null 2>&1; then
              echo "umbreld tRPC ready at iteration ${i}"
              READY=1
              break
            fi
            sleep 2
          done
          docker ps -a --filter name=umbrelos-test
          if [ "$READY" = "1" ]; then
            echo "=== Creating initial Umbrel user if onboarding is pending ==="
            docker exec umbrelos-test umbreld client user.create.mutate --name "UmbrelAdmin" --password "umbreltestpassword123" 2>&1 || true

            echo "=== Locating Umbrel app-store directory ==="
            docker exec umbrelos-test sh -c 'find /data /var /home -maxdepth 5 -name "umbrel-app-store.yml" -o -name "*umbrel-apps*" 2>/dev/null' || true
            STORE_DIR=$(docker exec umbrelos-test sh -c 'ls -d /data/umbrel-os/var/lib/umbrel/app-stores/* /var/lib/umbrel/app-stores/* /data/app-stores/* /home/umbrel/umbrel/app-stores/* 2>/dev/null | head -n 1')
            echo "Detected STORE_DIR=$STORE_DIR"
            if [ -n "$STORE_DIR" ]; then
              docker cp store/yakitori-act-ci "umbrelos-test:${STORE_DIR}/yakitori-act-ci"
              docker exec umbrelos-test rm -f \
                "${STORE_DIR}/yakitori-act-ci/data/app/.gitkeep" \
                "${STORE_DIR}/yakitori-act-ci/data/docker/.gitkeep" \
                "${STORE_DIR}/yakitori-act-ci/data/dind-run/.gitkeep" || true

              echo "=== Installing yakitori-act-ci through umbreld ==="
              docker exec umbrelos-test umbreld client apps.install.mutate --appId yakitori-act-ci 2>&1 || true
              for j in $(seq 1 45); do
                STATE=$(docker exec umbrelos-test umbreld client apps.state.query --appId yakitori-act-ci 2>&1 || true)
                echo "apps.state.query ($j): $STATE"
                if echo "$STATE" | grep -qi "ready"; then
                  break
                fi
                sleep 2
              done
              echo "=== Settled apps.logs.query ==="
              docker exec umbrelos-test umbreld client apps.logs.query --appId yakitori-act-ci 2>&1 || true

              echo "=== Checklist 1 & 2: App opens on Umbrel port 8755 and UI requires Umbrel login ==="
              curl -i -sS http://127.0.0.1:8755/ | head -n 25 || true
              curl -i -sS http://127.0.0.1:8755/tokens | head -n 25 || true

              echo "=== Checklist 3: API & MCP return 401 without bearer token on port 8755 ==="
              curl -i -sS http://127.0.0.1:8755/api/v1/repos | head -n 20 || true
              curl -i -sS -X POST http://127.0.0.1:8755/mcp -H "Content-Type: application/json" -d '{"jsonrpc":"2.0","id":1,"method":"ping"}' | head -n 20 || true

              echo "=== Inspecting nested Docker sidecar inside containerized umbrelOS ==="
              docker exec umbrelos-test docker ps -a 2>&1 || true

              echo "=== Checklist 5: Restarting app via apps.restart.mutate ==="
              docker exec umbrelos-test umbreld client apps.restart.mutate --appId yakitori-act-ci 2>&1 || true
              sleep 5
              docker exec umbrelos-test umbreld client apps.state.query --appId yakitori-act-ci 2>&1 || true

              echo "=== Update path: bumping manifest version to 0.1.1 and running apps.update.mutate ==="
              docker exec umbrelos-test sed -i 's/version: "0.1.0"/version: "0.1.1"/' "${STORE_DIR}/yakitori-act-ci/umbrel-app.yml"
              docker exec umbrelos-test umbreld client apps.update.mutate --appId yakitori-act-ci 2>&1 || true
              sleep 8
              docker exec umbrelos-test umbreld client apps.state.query --appId yakitori-act-ci 2>&1 || true
              curl -i -sS http://127.0.0.1:8755/api/v1/repos | head -n 20 || true
            fi
          else
            docker logs umbrelos-test 2>&1 | tail -n 80 || true
          fi
          docker rm -f -v umbrelos-test || true
