services:
  docker:
    image: docker:27.2.0-dind@sha256:f9f72ad901a78f27be922b2d320bbc263174f12919c1b37e6a01f828fa904565
    privileged: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=unix:///var/run/docker.sock
      - --host=tcp://0.0.0.0:2375
      - --storage-driver=overlay2
    volumes:
      - dind-storage:/var/lib/docker

  web:
    build: .
    restart: on-failure
    init: true
    stop_grace_period: 30s
    depends_on:
      - docker
    ports:
      - "${ACT_CI_LISTEN_PORT:-8755}:8080"
    environment:
      ACT_CI_DATA_DIR: /data
      ACT_CI_HOST: 0.0.0.0
      ACT_CI_PORT: "8080"
      ACT_CI_DOCKER_HOST: tcp://docker:2375
      ACT_CI_ALLOW_LOCAL_REPOS: "1"
    volumes:
      - app-data:/data

volumes:
  app-data:
  dind-storage:
